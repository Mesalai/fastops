[package]
name = "fastops"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Fast, safe copy, move, delete, clean and size for large folders"
readme = "README.md"
repository = "https://github.com/mesalai/fastops"
keywords = ["copy", "delete", "disk-usage", "parallel", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["demo.gif"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
indicatif = { version = "0.17", features = ["rayon"] }
walkdir = "2"
jwalk = "0.8"
dashmap = "6"
[dev-dependencies]
tempfile = "3"
